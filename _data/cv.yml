- title: Work Experience
  type: time_table
  contents:
    - title: Applied AI Research Scientist
      institution: VUNO Inc., Seoul, Korea
      year: 2025.01 - Present
      description:
        - title: "AI Research — Brain MRI (VUNO Med®-DeepBrain®)"
          contents:
            - Developed a small vessel disease localization model with cross-modality MRI registration, and integrated it into VUNO Med®-DeepBrain® as a new product feature.
            - Conducted research on MRI-based automated diagnosis systems, collaborating with Asan Medical Center for clinical validation.
            - Researched longitudinal MRI segmentation with explicit modeling of inter-scan registration and temporal changes.
            - Investigated clinical report generation using LLMs (e.g., gpt-oss, MedGemma) conditioned on medical imaging outputs.
        - title: "AI Research & Engineering — Chest X-ray (VUNO Med®-Chest X-ray™)"
          contents:
            - Developing models that leverage vision-language models (VLMs) for chest X-ray analysis.
            - Building Airflow-based data pipelines for consolidating large-scale multi-institutional chest X-ray datasets under a unified schema, with a FastAPI-based inspection web UI.
            - Developing MLOps infrastructure — experiment tracking, distributed hyperparameter search, and a SLURM-based multi-node GPU cluster with validated multi-node distributed (DDP) training.
        - title: "Engineering"
          contents:
            - Reduced the production Docker image size by 57% through build-step optimization and Docker layer history analysis, significantly improving build time.
            - Unified previously separate research and production repositories into a single monorepo for streamlined management.
            - Built a CI pipeline to automatically test asynchronous task execution using Celery with a Redis broker in a containerized environment.
    - title: Computer Vision Research Engineer Intern
      institution: NextLab, Seoul, Korea
      year: 2021.09 - 2021.12
      description:
        - "Automated a highway drone control pipeline: lane region recognition, vehicle type classification, and optical flow/tracking integration; demonstrated on a live highway in Cheonan and filed a related patent."
        - Implemented an end-to-end OCR pipeline surpassing the EasyOCR baseline in Korean text recognition performance.
        - Built a subtitle anomaly detection system for streaming videos with dataset creation, recognition modules, and a multithreading pipeline.

